# Copy to alpha-beta-CROWN/complete_verifier/exp_configs/beta_crown/ before
# use -- onnx_path below is relative to complete_verifier/, where abcrown.py
# runs from, not to this file's own location. Run:
#   cd alpha-beta-CROWN/complete_verifier && ../.venv/bin/python abcrown.py \
#     --config exp_configs/beta_crown/abcrown_config_inception_mnist_unfused.yaml
#
# Results as of PROGRESS.md's 2026-08-23 entry: final verified accuracy
# 20.0% (2/10 safe-incomplete, 0 unsafe, 8 timeout) at epsilon=0.1, 60s
# bab timeout/image -- this is the real comparison baseline (the fused
# model's counterpart config cannot be run at all, see BUGS.md #11).
model:
  onnx_path: ../../NNs/inception_mnist_unfused_simplified.onnx
data:
  dataset: MNIST
  mean: [0.]
  std: [1.]
  start: 0
  end: 10
specification:
  norm: .inf
  epsilon: 0.1
attack:
  # Matches inception_mnist_fused.yaml's setting for a fair, identical
  # methodology between the two -- the fused model's tensat-selected
  # structure needs this (see that config's comment), so this one uses
  # it too even though it isn't strictly necessary here.
  pgd_order: skip
  pgd_restarts: 50
solver:
  batch_size: 2048
  beta-crown:
    iteration: 20
bab:
  timeout: 60
